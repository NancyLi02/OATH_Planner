actions:
  load:
    guard: 'bb || cb  || db || eb || fb || bc || cc  || dc || ec || bd || cd  || dd || ed || fd || be || ce  || de || ee'
    type: load
    weight: 0
  stay:
    guard: '1'
    synchronized_transition:
      guard: '1'
      type: synchronized_transition
      weight: 0
    type: stay
    weight: 0
  unload:
    guard: ' b || c || d || e '
    type: unload
    weight: 0
state_dim:
- 2d_pose_region
- Drone_state
state_models:
  2d_pose_region:
    initial: '0'
    ts_type: 2d_pose_region
  Drone_state:
    initial: "unloaded"
    nodes:
      loaded1:
        attr:
          labels: ['loaded1']
        connected_to:
          unloaded: unload
          loaded1: load
          loaded2: load
      loaded2:
        attr:
          labels: ['loaded2']
        connected_to:
          unloaded: unload
          loaded2: load
          loaded3: load
      loaded3:
        attr:
          labels: ['loaded3']
        connected_to:
          unloaded: unload
          loaded3: load
      unloaded:
        attr:
          labels: ['unloaded']
        connected_to:
          loaded1: load
          unloaded: unload
    ts_type: Drone_state